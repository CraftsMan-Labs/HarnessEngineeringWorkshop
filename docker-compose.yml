services:
  ninerouter:
    image: decolua/9router:latest
    container_name: ninerouter
    restart: unless-stopped
    # Bridge networking (the default): network_mode: host does not work on
    # Docker Desktop for Windows at all, and is unreliable on Mac, so both
    # services publish explicit ports instead. Binding the host side to
    # 127.0.0.1 keeps this off the LAN, matching the old host-networking
    # "loopback-only" posture.
    ports:
      - "127.0.0.1:20128:20128"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - INITIAL_PASSWORD=${NINEROUTER_INITIAL_PASSWORD:-123456}
    volumes:
      - ninerouter_data:/app/data

  dsh:
    build:
      context: ./docker/dsh
    container_name: dsh
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
      - "127.0.0.1:${FACTORY_API_PORT:-13081}:${FACTORY_API_PORT:-13081}"
    depends_on:
      - ninerouter
    environment:
      - DSH_HOME=/home/node/.dsh
      - DSH_WEB_AUTH=${DSH_WEB_AUTH:-0}
      # dsh's CLI refuses --host 0.0.0.0 by default (RCE-exposure guard);
      # allow-lan-bind.mjs gates that check on this instead. Required so the
      # published ports above (bridge networking) can reach the process at
      # all — see docker/README.md.
      - DSH_ALLOW_ALL_INTERFACES=1
      - NINEROUTER_BASE_URL=${NINEROUTER_BASE_URL:-http://ninerouter:20128/v1}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-cc/claude-opus-4-6}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
      - FACTORY_PLUGIN_ENABLED=${FACTORY_PLUGIN_ENABLED:-1}
      - FACTORY_PLUGIN_PATH=/opt/dsh-software-factory
      - FACTORY_STATE_PATH=${FACTORY_STATE_PATH:-/workspace/.factory}
      - FACTORY_WORKSPACE=/workspace
      - FACTORY_MUTATION_TOOLS=${FACTORY_MUTATION_TOOLS:-write,edit,bash,shell,apply_patch,str_replace,write_file,edit_file,run_terminal_cmd}
      - FACTORY_GATE_COMMANDS=${FACTORY_GATE_COMMANDS:-npm test}
      - FACTORY_API_PORT=${FACTORY_API_PORT:-13081}
    volumes:
      - dsh_home:/home/node/.dsh
      - ./workspace:/workspace
      - ./plugins/dsh-software-factory:/opt/dsh-software-factory:ro

volumes:
  ninerouter_data:
  dsh_home:
