<section class="slide s-paper s-split">
        <img class="brand" src="assets/logo-agentics.svg" alt="Agentics Foundation Event" />
        <div class="pad">

              <span class="tick tick-tl"></span><span class="tick tick-tr"></span>
              <span class="tick tick-bl"></span><span class="tick tick-br"></span>

                <div class="flow">
                  <div class="flow-harness">
                    <div class="box">Task</div>

                    <div class="shell-box">
                      <strong>Harness</strong>

                    </div>

                    <div class="box">Result</div>
                  </div>
                </div>

              <h2 class="h-md a-rise">Congratulations. You invented a harness.</h2>
              <ul class="lines a-stagger">
                <li>What the model sees.</li>
                <li>What it is allowed to do.</li>
                <li>How work is judged, and what happens next.</li>
              </ul>
            </div>
          </div>
        </div>
        <footer class="foot"><span>Software Hacktory</span><span>{{N}} / {{TOTAL}}</span></footer>
